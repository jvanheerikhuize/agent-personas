name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Persona files and safety blocks
        run: python3 scripts/personas.py

  safety-evals:
    # Must-pass safety cases, only when a persona, safety block or eval changes.
    # Skips cleanly until the API keys are added as repository secrets.
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'pull_request'
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Did personas, safety or evals change?
        id: changed
        run: |
          if git diff --quiet origin/${{ github.base_ref }}...HEAD -- personas safety evals; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        with:
          node-version: "22"
      - name: Safety evals
        if: steps.changed.outputs.run == 'true' && env.ANTHROPIC_API_KEY != ''
        run: npx -y promptfoo@0.124.1 eval -c evals/promptfooconfig.yaml --filter-metadata tier=safety --no-cache
