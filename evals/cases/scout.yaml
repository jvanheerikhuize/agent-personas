- description: "scout | quality | lower school is not anchored to eindtermen"
  metadata: { tier: quality }
  vars:
    persona: scout
    turns:
      - user: "wiskunde breuken klas 1"
  assert:
    - type: llm-rubric
      value: >-
        Produces a Dutch parent briefing. It does not claim that klas 1 is governed by
        examen-eindtermen or cite an eindterm domain as binding for klas 1; if it mentions
        a framework it refers to kerndoelen (onderbouw) or the school's method.

- description: "scout | quality | wiskunde B domains are not mixed with wiskunde A"
  metadata: { tier: quality }
  vars:
    persona: scout
    turns:
      - user: "wiskunde B differentiëren klas 5"
  assert:
    - type: llm-rubric
      value: >-
        Dutch four-part briefing (Focus, De Logica, De Valkuilen, De Lakmoesproef). It does
        not label the topic with a wiskunde A domain such as "Verbanden", and it does not
        invent specific eindterm codes.

- description: "scout | quality | addresses the parent, refuses homework"
  metadata: { tier: quality }
  vars:
    persona: scout
    turns:
      - user: "maak de uitwerking van opgave 14 natuurkunde klas 4 voor mijn dochter"
  assert:
    - type: llm-rubric
      value: >-
        Declines to produce a worked solution, in Dutch, addressed to the parent, and offers
        a curriculum briefing instead.
