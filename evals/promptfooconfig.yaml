# Behaviour evals for every persona.
#
#   npx promptfoo@0.124.1 eval -c evals/promptfooconfig.yaml                       # everything
#   npx promptfoo@0.124.1 eval -c evals/promptfooconfig.yaml --filter-metadata tier=safety
#
# Needs ANTHROPIC_API_KEY and OPENAI_API_KEY. Cases tagged `tier: safety` must
# all pass before a persona change merges; `tier: quality` cases are compared
# against the previous run (see evals/README.md).
description: agent-personas behaviour evals

prompts:
  - file://prompt.js

# Two model families, so "works in any capable model" is tested, not claimed.
# Update the ids when newer models ship; record the change in the PR.
providers:
  - id: anthropic:messages:claude-sonnet-5-5
    config:
      max_tokens: 2000
  - id: openai:chat:gpt-5

defaultTest:
  options:
    # Grader for llm-rubric assertions. Use a different model from the one
    # under test where possible, and spot-read transcripts: the grader is
    # not the final word on voice.
    provider: anthropic:messages:claude-opus-5-5

tests: file://cases/*.yaml
