# =============================================================================
# Catalog — module metadata and cross-persona workflows
# =============================================================================
# Source of truth for everything in index.yaml that is not owned by a single
# persona. Per-persona metadata lives in roles/<category>/<slug>/role.md
# frontmatter. tools/build.py merges this file with the frontmatter to generate
# index.yaml and dist/prompts/.
# =============================================================================

module:
  name: agent-personas
  version: "0.1.0"
  description: >
    Conversational AI personas you paste into any chat or system prompt, safe
    by construction. Each persona is a single self-contained role.md (metadata
    frontmatter + prompt body). The build tool compiles personas into
    paste-ready prompts under dist/prompts/ and a machine-readable index.yaml.
    Extracted from Agent-Roles at v2.0.0-alpha.3.
  license: MIT
  author: "Jerry van Heerikhuize"
  repository: https://github.com/jvanheerikhuize/agent-personas

# Category ordering for the generated index (personas sorted by slug within each).
categories:
  - health
  - education
  - entertainment

workflows:

  education-vwo:
    name: "VWO Study Support"
    description: >
      Parent briefing followed by student coaching. The parent gets context
      first; the student then runs a study session.
    steps:
      - scout
      - mentor

  health-crisis-safety:
    name: "Health and Crisis Safety"
    description: >
      Health-adjacent personas sharing crisis detection infrastructure,
      GDPR Art. 9 handling, and safe-messaging protocols.
    members:
      - psy
      - frank
      - papa
      - vita
